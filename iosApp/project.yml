name: iosApp
options:
  bundleIdPrefix: com.bookxpert
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
    settings:
      base:
        PRODUCT_NAME: EmployeeDirectory
        PRODUCT_BUNDLE_IDENTIFIER: com.bookxpert.employeemanager.iosApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CADisableMinimumFrameDurationOnPhone: YES
      configs:
        Debug:
          BUILD_ACTIVE_RESOURCES_ONLY: YES
        Release:
          VALIDATE_PRODUCT: YES
    dependencies:
      - framework: ../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/ComposeApp.framework
        embed: false
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        shell: /bin/sh
        basedOnDependencyAnalysis: false
